name: Live macOS-26 Shell (bore.pub)

on:
  workflow_dispatch:

jobs:
  interactive-shell:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Start SSH session via bore
        run: |
          sudo systemsetup -setremotelogin on

          USERNAME="sshuser"

          # Create a fresh user
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/bash
          sudo dscl . -create /Users/$USERNAME RealName "SSH User"
          sudo dscl . -create /Users/$USERNAME UniqueID 1099
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
          sudo mkdir -p /Users/$USERNAME
          sudo chown $USERNAME:staff /Users/$USERNAME

          # Give sudo access
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME

          # Add your SSH keys
          sudo mkdir -p /Users/$USERNAME/.ssh
          curl -s https://github.com/WolfgangWaltenberger.keys | sudo tee /Users/$USERNAME/.ssh/authorized_keys
          sudo chown -R $USERNAME:staff /Users/$USERNAME/.ssh
          sudo chmod 700 /Users/$USERNAME/.ssh
          sudo chmod 600 /Users/$USERNAME/.ssh/authorized_keys

          # Install pipx
          # brew install pipx
          # sudo -u $USERNAME pipx ensurepath
          # sudo -u $USERNAME pipx install ipython numpy sympy scipy onnxruntime

          # Set up colored prompt without hostname
          sudo tee /Users/$USERNAME/.bash_profile << 'PROFILE'
          export CLICOLOR=1
          export LSCOLORS=GxFxCxDxBxegedabagaced
          export TERM=xterm-256color

          # Colored prompt: green user, blue directory, no hostname
          export PS1='\[\033[01;32m\]\u\[\033[00m\] \[\033[01;34m\]\w\[\033[00m\] \$ '

          # Colored ls
          alias ls='ls --color=auto 2>/dev/null || ls -G'
          alias ll='ls -lah'
          alias grep='grep --color=auto'

          # Useful stuff
          export HOMEBREW_NO_AUTO_UPDATE=1
          export PATH="/opt/homebrew/bin:~/.local/bin:/Users/$USER/.local/bin:$PATH"

          echo ""
          echo -e "\033[1;36m  macOS 26 — GitHub Actions Runner\033[0m"
          echo -e "\033[0;33m  arch: $(uname -m) | cores: $(sysctl -n hw.ncpu) | mem: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))GB\033[0m"
          echo ""
          PROFILE

          sudo chown $USERNAME:staff /Users/$USERNAME/.bash_profile

          # Install and start bore tunnel
          brew install bore-cli
          bore local 22 --to bore.pub 2>&1 | tee /tmp/bore.log &
          sleep 5

          echo ""
          echo "========================================"
          echo "Username: $USERNAME"
          echo "Connect:  ssh $USERNAME@bore.pub -p <PORT>"
          echo "(check above output for the assigned port)"
          echo "========================================"

          while true; do sleep 30; done
