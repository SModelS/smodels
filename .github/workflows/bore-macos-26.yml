name: Interactive macOS-26 Shell (via bore.pub)

on:
  workflow_dispatch:

jobs:
  macos26_shell:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Start SSH session via bore
        run: |
          # Enable macOS remote login
          sudo systemsetup -setremotelogin on

          # Add your GitHub SSH keys
          mkdir -p ~/.ssh
          curl -s https://github.com/WolfgangWaltenberger.keys >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          # Install bore
          brew install bore-cli

          # Start bore tunnel
          bore local 22 --to bore.pub &
          sleep 5

          echo "========================================"
          echo "Check output above for the assigned port"
          echo "Connect with: ssh runner@bore.pub -p <PORT>"
          echo "========================================"

          while true; do sleep 30; done
